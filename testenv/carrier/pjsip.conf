; Simulierter Anbieter („Fake-Carrier“) für die Testumgebung.
; Die Test-Anlage meldet sich hier als Konto „p4a“ an (Passwort aus CARRIER_PASSWORD);
; Testanrufer ohne Anmeldung landen als „anonymous“ in from-world und werden zur Anlage
; durchgestellt.

[global]
type=global
user_agent=Phone4all Fake-Carrier
endpoint_identifier_order=username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[p4a]
type=auth
auth_type=userpass
username=p4a
password=@CARRIER_PASSWORD@

[p4a]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[p4a]
type=endpoint
context=from-pbx
aors=p4a
auth=p4a
disallow=all
allow=alaw,ulaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_pai=yes
trust_id_inbound=yes

[anonymous]
type=endpoint
context=from-world
disallow=all
allow=alaw,ulaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
