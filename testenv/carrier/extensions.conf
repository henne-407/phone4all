; Wählplan des Fake-Carriers
;
; from-pbx:   Anrufe der Anlage „nach außen“
;   0800666…   besetzt (486)
;   0800404…   unbekannte Nummer (404)
;   0800999…   klingelt, nimmt nie ab
;   alles andere: annehmen, Ansage, dann Echo (Sprachweg prüfen)
; from-world: Anrufe „von außen“ an eine Rufnummer der Anlage
;   die gewählte Nummer geht unverändert an das Konto p4a (Request-URI und To)

[general]
static=yes
writeprotect=yes

[from-pbx]
; Nummern kommen je nach Format des Kontos als +49…, 0049… oder 0…
exten => _+49X.,1,Goto(0${EXTEN:3},1)
exten => _0049X.,1,Goto(0${EXTEN:4},1)
exten => _+X.,1,Goto(00${EXTEN:1},1)
exten => _0800666X.,1,Busy(5)
exten => _0800404X.,1,Hangup(1)
exten => _0800999X.,1,Ringing()
 same => n,Wait(120)
 same => n,Hangup()
exten => _X.,1,NoOp(Anlage ruft ${EXTEN} mit Absender ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

[from-world]
exten => _[+0-9].,1,NoOp(Anruf von ${CALLERID(num)} an ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@p4a,60)
 same => n,Hangup()
