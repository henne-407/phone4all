appId: de.hpieper.SipTelefon
productName: Phone4All
copyright: Copyright © 2026 Henning Pieper
directories:
  output: dist
  buildResources: resources/icons
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icons
    to: icons
asarUnpack: []
artifactName: Phone4All-${version}-${os}-${arch}.${ext}
# Einrichtungslinks der Phone4all-Telefonanlage (sip-telefon://provision?url=…)
protocols:
  - name: SIP-Telefon-Einrichtung
    schemes: [sip-telefon]

linux:
  # tar.gz: Update für den entpackten Ordner aus scripts/install-linux.sh
  target: [AppImage, deb, rpm, tar.gz]
  icon: resources/icons/icon.png
  category: Network;Telephony
  executableName: sip-telefon
  synopsis: Softphone für SIP-Telefonanlagen
  desktop:
    entry:
      Name: Phone4All
      GenericName: Softphone
      Comment: Telefonieren über deine SIP-Telefonanlage
      Keywords: SIP;VoIP;Telefon;Anruf;Softphone;
      StartupWMClass: SIP-Telefon
      MimeType: x-scheme-handler/sip-telefon;
  extraResources:
    - from: resources/linux
      to: linux
deb:
  depends: [baresip-core, baresip, libnotify4, libsecret-1-0]
rpm:
  depends: [baresip, baresip-pipewire, libsecret]
  fpm: ['--rpm-rpmbuild-define=_build_id_links none']

mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.business
  icon: resources/icons/icon.png
  # Ad-hoc-Signatur: ohne Signatur startet die App auf Apple Silicon nicht
  # („beschädigt“). Notarisiert ist sie damit nicht, siehe README.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Phone4All braucht das Mikrofon für Telefongespräche.
    NSCameraUsageDescription: Phone4All braucht die Kamera für Videoanrufe im Messenger.
    LSMultipleInstancesProhibited: true
  extraResources:
    - from: build/engine
      to: baresip
dmg:
  title: Phone4All ${version}

win:
  target: [nsis]
  icon: resources/icons/icon.ico
  extraResources:
    - from: build/engine
      to: baresip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Phone4All
  uninstallDisplayName: Phone4All
