name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BARESIP_VERSION: v4.12.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: rpmbuild installieren
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - name: Pakete bauen
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten für baresip
        run: brew install cmake ninja openssl@3 opus portaudio dylibbundler
      - name: baresip bauen
        run: scripts/build-engine.sh
      - run: npm ci
      - run: npm run build
      # hdiutil kann die DMG beim Aushängen nicht freigeben („Resource busy“), wenn Spotlight
      # sie gerade indiziert. Spotlight aus und den Bau bei diesem Fehler bis zu dreimal versuchen
      - name: Spotlight ausschalten
        run: sudo mdutil -a -i off || true
      - name: App bauen
        run: |
          for i in 1 2 3; do
            npx electron-builder --mac --${{ matrix.arch }} --publish never 2>&1 | tee build.log && exit 0
            grep -q 'Resource busy' build.log || exit 1
            echo "::warning::DMG war belegt, Versuch $i wiederholen"
            for v in /Volumes/SIP-Telefon*; do [ -d "$v" ] && hdiutil detach -force "$v" || true; done
            sleep 10
          done
          exit 1
        shell: bash -o pipefail {0}
        env:
          # Ad-hoc-Signatur braucht keine Secrets, also auch in PR-Builds signieren
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Signatur prüfen
        run: |
          app=$(find dist -maxdepth 2 -name 'Phone4All.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -i signature
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Abhängigkeiten für baresip (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl opus portaudio getopt --triplet x64-windows
      - name: baresip bauen
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
        run: scripts/build-engine.sh
      - run: npm ci
      - run: npm run build
      - name: App bauen
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Prüfsummen
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
