name: Telefonanlage

on:
  push:
    branches: ['**']
    tags: ['pbx-v*']
    paths: ['pbx/**', '.github/workflows/pbx.yml']
  pull_request:
    paths: ['pbx/**', '.github/workflows/pbx.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: pbx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pbx/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Image für amd64 und arm64 (z. B. Raspberry Pi). Kanäle der Online-Updates:
  #   pbx-v1.2.3        → :1.2.3, :latest und :beta
  #   pbx-v1.3.0-beta.1 → :1.3.0-beta.1 und :beta
  #   main              → :edge
  image:
    needs: test
    # Tags auch per workflow_dispatch (vom Release-Workflow gestartet)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/pbx-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version und Tags bestimmen
        id: meta
        working-directory: .
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phone4all-pbx
          if [[ "$GITHUB_REF" == refs/tags/pbx-v* ]]; then
            version=${GITHUB_REF#refs/tags/pbx-v}
            tags="$image:$version,$image:beta"
            [[ "$version" != *-* ]] && tags="$tags,$image:latest"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            version=0.0.0-edge.$(date +%Y%m%d).${GITHUB_SHA::7}
            tags="$image:edge"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: pbx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: PBX_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/pbx-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Telefonanlage ${{ steps.meta.outputs.version }}" --generate-notes \
            $([[ "${{ steps.meta.outputs.prerelease }}" == true ]] && echo --prerelease) \
            pbx/docker-compose.yml pbx/install.sh
