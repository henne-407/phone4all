name: Telefonanlage

on:
  push:
    branches: ['**']
    tags: ['pbx-v*']
    paths: ['pbx/**', 'src/**', '.github/workflows/pbx.yml']
  pull_request:
    paths: ['pbx/**', 'src/**', '.github/workflows/pbx.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: pbx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pbx/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Pull Requests, die das Image ändern: einmal bauen (ohne Veröffentlichen), damit main nicht erst nach dem Merge bricht
  image-check:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            image:
              - 'pbx/Dockerfile*'
              - 'pbx/package*.json'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.changes.outputs.image == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.image == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.changes.outputs.image == 'true'
        with:
          context: .
          file: pbx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
      - name: Spracherkennung im Image startet
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pbx/Dockerfile
          platforms: linux/amd64
          load: true
          tags: phone4all-pbx:check
          cache-from: type=gha
      - if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm --entrypoint /opt/whisper/whisper-cli phone4all-pbx:check -h > /dev/null
          docker run --rm --entrypoint /opt/whisper/whisper-cli-avx2 phone4all-pbx:check -h > /dev/null

  # Image für amd64 und arm64 (z. B. Raspberry Pi). Kanäle der Online-Updates:
  #   pbx-v1.2.3        → :1.2.3, :latest und :beta
  #   pbx-v1.3.0-beta.1 → :1.3.0-beta.1 und :beta
  #   main              → :edge
  image:
    needs: test
    # Tags auch per workflow_dispatch (vom Release-Workflow gestartet)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/pbx-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version und Tags bestimmen
        id: meta
        working-directory: .
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phone4all-pbx
          if [[ "$GITHUB_REF" == refs/tags/pbx-v* ]]; then
            version=${GITHUB_REF#refs/tags/pbx-v}
            tags="$image:$version,$image:beta"
            [[ "$version" != *-* ]] && tags="$tags,$image:latest"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            version=0.0.0-edge.$(date +%Y%m%d).${GITHUB_SHA::7}
            tags="$image:edge"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pbx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: PBX_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/pbx-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Telefonanlage ${{ steps.meta.outputs.version }}" --generate-notes \
            $([[ "${{ steps.meta.outputs.prerelease }}" == true ]] && echo --prerelease) \
            pbx/docker-compose.yml pbx/install.sh
