name: Home Assistant

on:
  push:
    branches: ['**']
    paths: ['custom_components/**', 'tests/**', 'blueprints/**', 'hacs.json', 'pytest.ini', '.github/workflows/homeassistant.yml']
  pull_request:
    paths: ['custom_components/**', 'tests/**', 'blueprints/**', 'hacs.json', 'pytest.ini', '.github/workflows/homeassistant.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: pytest

  # Prüfungen von Home Assistant (Manifest, Übersetzungen) und HACS
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # Marken-Icons und Topics sind nur für das HACS-Standardverzeichnis nötig
          ignore: brands topics description
