name: Home Assistant

on:
  push:
    branches: ['**']
    paths: ['custom_components/**', 'tests/**', 'blueprints/**', 'hacs.json', 'pytest.ini', '.github/workflows/homeassistant.yml']
  pull_request:
    paths: ['custom_components/**', 'tests/**', 'blueprints/**', 'hacs.json', 'pytest.ini', '.github/workflows/homeassistant.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: pytest

  # Prüfungen von Home Assistant (Manifest, Übersetzungen) und HACS
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # Marken-Icons und Topics sind nur für das HACS-Standardverzeichnis nötig
          ignore: brands topics description
