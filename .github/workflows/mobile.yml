name: Mobil-App

on:
  push:
    branches: ['**']
    tags: ['mobile-v*']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

env:
  EXPO_OFFLINE: 1
  CI: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: JavaScript für Android und iOS bündeln
        run: npm run bundle

  # APK zum direkten Installieren (signiert mit dem Debug-Schlüssel von Expo)
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Natives Projekt erzeugen
        run: npx expo prebuild --platform android --no-install
      - name: APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: APK benennen
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/SIP-Telefon-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out/*.apk

  # Ohne Apple-Entwicklerkonto: Simulator-Build zur Prüfung und unsignierte IPA
  # (z. B. mit Sideloadly/AltStore und eigener Apple-ID aufs iPhone)
  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Natives Projekt erzeugen
        run: npx expo prebuild --platform ios
      - name: Für den Simulator bauen
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace SIPTelefon.xcworkspace -scheme SIPTelefon -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Für iPhone bauen (unsigniert)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace SIPTelefon.xcworkspace -scheme SIPTelefon -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -40
      - name: IPA packen
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out/Payload
          cp -R ios/build-device/Build/Products/Release-iphoneos/SIPTelefon.app out/Payload/
          (cd out && zip -qr "SIP-Telefon-$version-unsigniert.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/out/*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
