name: Mobil-App

on:
  push:
    branches: ['**']
    tags: ['mobile-v*']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

env:
  EXPO_OFFLINE: 1
  CI: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: JavaScript für Android und iOS bündeln
        run: npm run bundle

  # APK zum direkten Installieren (signiert mit dem eigenen Schlüssel, falls hinterlegt)
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - name: Natives Projekt erzeugen
        run: npx expo prebuild --platform android --no-install
      - name: APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      # Eigener Schlüssel aus den Repository-Secrets (siehe mobile/README.md). Ohne ihn bleibt
      # die APK mit dem öffentlich bekannten Debug-Schlüssel signiert.
      - name: Mit dem Release-Schlüssel signieren
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'phone4all' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Kein Release-Schlüssel (ANDROID_KEYSTORE_BASE64) – APK ist mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" "$apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | grep -i 'certificate SHA-256'
          mv "$RUNNER_TEMP/signed.apk" "$apk"
      - name: APK benennen
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/SIP-Telefon-$version.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: mobile/out/*.apk

  # Ohne Apple-Entwicklerkonto: Simulator-Build zur Prüfung und unsignierte IPA
  # (z. B. mit Sideloadly/AltStore und eigener Apple-ID aufs iPhone)
  ios:
    needs: test
    # Expo SDK 58 braucht Xcode 26 (Swift 6.2)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Natives Projekt erzeugen
        run: npx expo prebuild --platform ios
      - name: Für den Simulator bauen
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace SIPTelefon.xcworkspace -scheme SIPTelefon -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO > build-sim.log 2>&1 \
            || { grep -n -A12 -E 'error:|\*\* BUILD FAILED' build-sim.log | head -300; exit 1; }
          tail -5 build-sim.log
      - name: Für iPhone bauen (unsigniert)
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace SIPTelefon.xcworkspace -scheme SIPTelefon -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build-device.log 2>&1 \
            || { grep -n -A12 -E 'error:|\*\* BUILD FAILED' build-device.log | head -300; exit 1; }
          tail -5 build-device.log
      - name: IPA packen
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out/Payload
          cp -R ios/build-device/Build/Products/Release-iphoneos/SIPTelefon.app out/Payload/
          (cd out && zip -qr "SIP-Telefon-$version-unsigniert.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: mobile/out/*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Prüfsummen
        # ohne Checkout gibt es kein mobile/, daher im Workspace selbst
        working-directory: ${{ github.workspace }}
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
